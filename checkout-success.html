<!-- Esta pagina corria con la paleta de dos redisenos atras (--noir:#14110F,
     --tiffany turquesa). Ahora comparte el mismo sistema que el resto del sitio. -->
<link rel="stylesheet" href="tokens.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--ivory);
  color:var(--ink);
  display:grid;place-items:center;min-height:100vh;padding:20px;
}

.success-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:50px 40px;
  text-align:center;
  max-width:540px;
  width:100%;
  box-shadow:var(--shadow-sm);
}

/* El circulo de exito era turquesa #0ABAB5: el check blanco encima daba
   2.41:1. Con --salvia da 6.26:1 y ademas deja de ser el unico turquesa
   de todo el sitio. */
.success-icon{
  width:72px;height:72px;margin:0 auto 24px;
  background:var(--salvia);border-radius:50%;
  display:grid;place-items:center;color:#fff;
  font-size:40px;
}

h1{
  font-family:var(--serif);
  font-size:var(--fs-2xl);
  line-height:var(--lh-apretado);
  margin-bottom:6px;
  color:var(--noir);
}

.customer-name{
  font-size:var(--fs-lg);
  color:var(--ink-soft);
  margin-bottom:18px;
  font-style:italic;
}

.ref-number{
  font-size:var(--fs-2xs);
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:28px;
}

.msg{
  font-size:var(--fs-md);
  line-height:var(--lh-suelto);
  color:var(--ink-soft);
  margin-bottom:0;
}

/* Productos */
.section{
  margin-top:32px;
  padding-top:28px;
  border-top:1px solid var(--line);
  text-align:left;
}

.section-title{
  font-size:var(--fs-2xs);
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:16px;
  font-weight:600;
}

.product-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:12px;
  font-size:var(--fs-sm);
}
.product-row:last-child{border-bottom:none}

.product-name{
  color:var(--noir);
  font-weight:500;
  flex:1;
}
.product-sub{
  font-size:var(--fs-2xs);
  color:var(--ink-soft);
  margin-top:2px;
}
.product-price{
  color:var(--noir);
  font-weight:600;
  white-space:nowrap;
}

/* Totales */
.totals{
  margin-top:0;
}
.total-row{
  display:flex;justify-content:space-between;
  padding:9px 0;
  font-size:var(--fs-sm);
  border-bottom:1px solid var(--line);
}
.total-row:last-child{border-bottom:none}
.total-label{color:var(--ink-soft)}
.total-value{font-weight:600;color:var(--noir)}
.total-value.discount{color:var(--salvia)}          /* 6.16:1 (antes 4.71:1) */
/* El TOTAL era turquesa sobre blanco = 2.41:1: la cifra mas importante de
   toda la compra, ilegible. Ahora es --noir a 15.48:1 y el peso lo da el
   tamano, no un color que no se puede leer. */
.total-value.grand{font-size:var(--fs-lg);color:var(--noir)}
.total-label.grand{font-weight:600;color:var(--noir);font-size:var(--fs-md)}

/* Estado */
.status-badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:var(--r-full);
  font-size:var(--fs-2xs);
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:28px;
}
.status-badge.approved{background:#E8F5E9;color:#256B29}  /* 5.81:1 (antes 4.56:1) */
.status-badge.pending{background:#FFF8E1;color:#6E4A00}   /* 7.48:1 (antes #F57F17 = 2.49:1 ✘) */
.status-badge.checking{background:#F5F5F5;color:#5C5C5C}  /* 6.13:1 (antes #777 = 4.11:1 ✘) */

.btn{
  display:inline-flex;
  align-items:center;
  margin-top:32px;
  padding:14px 36px;
  background:var(--noir);
  color:#fff;
  text-decoration:none;
  font-size:var(--fs-2xs);
  letter-spacing:.15em;
  text-transform:uppercase;
  font-weight:600;
  border-radius:var(--radius);
  transition:var(--dur-rapido);
  min-height:48px;
}
.btn:hover{background:var(--rose-deep)}

@media(max-width:480px){
  .success-card{padding:36px 22px}
}
</style>

<body>

<div class="success-card">
  <div class="success-icon">✓</div>

  <h1>¡Compra confirmada!</h1>
  <div class="customer-name" id="customerName" style="display:none"></div>
  <div class="ref-number" id="refNumber"></div>

  <div class="status-badge approved" id="statusBadge">Confirmada</div>

  <p class="msg">Recibirás un correo de confirmación con los detalles de tu pedido.</p>

  <!-- Productos -->
  <div class="section" id="productsSection" style="display:none">
    <div class="section-title">Productos</div>
    <div id="productsList"></div>
  </div>

  <!-- Totales -->
  <div class="section totals" id="totalsSection" style="display:none">
    <div class="section-title">Resumen de pago</div>
    <div id="totalsList"></div>
  </div>

  <a href="index.html" class="btn">Volver al catálogo</a>
</div>

<!-- Esta página es SOLO cosmética + guarda el pedido en el perfil local.
     El registro en Google Sheets y el correo de confirmación los hace el
     WEBHOOK de Wompi en el servidor (av-functions), sin depender del
     navegador. Por eso aquí NO se cargan checkout.js / store.js / etc.:
     así ningún script externo lento puede congelar la página. Lo único
     que se necesita es perfil.js para "Mis pedidos". -->
<script src="perfil.js?v=3"></script>
<script>
(function(){
  function money(n){ return "$ " + Math.round(n).toLocaleString("es-CO"); }
  function $(id){ return document.getElementById(id); }

  function render(){
    try{
      const params = new URLSearchParams(window.location.search);
      const ref    = params.get('ref');
      if(ref && $('refNumber')) $('refNumber').textContent = "Ref: " + ref;

      // sessionStorage se pierde al volver del redirect externo de Wompi
      // (móvil sobre todo). Recuperamos el pedido desde localStorage.
      const orderRaw = sessionStorage.getItem('av_order') || localStorage.getItem('av_order');
      let order = null;
      try{ order = orderRaw ? JSON.parse(orderRaw) : null; }catch(e){ order = null; }

      // Nombre del cliente
      if(order && order.firstName && $('customerName')){
        $('customerName').textContent = "Hola, " + order.firstName + " " + (order.lastName || "");
        $('customerName').style.display = "";
      }

      // Productos
      if(order && order.cart && order.cart.length && $('productsList')){
        order.cart.forEach(item => {
          const row = document.createElement('div');
          row.className = 'product-row';
          row.innerHTML =
            '<div><div class="product-name">' + (item.qty > 1 ? item.qty + "× " : "") + item.name + '</div>' +
            (item.color ? '<div class="product-sub">' + item.color + '</div>' : "") +
            (item.size  ? '<div class="product-sub">Talla ' + item.size + '</div>' : "") +
            '</div><div class="product-price">' + money(item.price * item.qty) + '</div>';
          $('productsList').appendChild(row);
        });
        $('productsSection').style.display = "";
      }

      // Totales
      if(order && (order.subtotal !== undefined || order.total !== undefined) && $('totalsList')){
        const subtotal = order.subtotal || order.total || 0;
        const descPct  = order.discount || 0;
        const descMonto = descPct ? Math.round(subtotal * descPct / 100) : 0;
        const subtotalConDesc = subtotal - descMonto;
        const envio = order.shipping !== undefined ? order.shipping : 0;
        const total = order.total !== undefined ? order.total : (subtotalConDesc + envio);
        const rows = [];
        rows.push('<div class="total-row"><span class="total-label">Subtotal</span><span class="total-value">' + money(subtotal) + '</span></div>');
        if(descMonto > 0)
          rows.push('<div class="total-row"><span class="total-label">Descuento Club (' + descPct + '%)</span><span class="total-value discount">− ' + money(descMonto) + '</span></div>');
        rows.push('<div class="total-row"><span class="total-label">Envío</span><span class="total-value">' + (envio === 0 ? "Gratis" : money(envio)) + '</span></div>');
        rows.push('<div class="total-row"><span class="total-label grand">Total pagado</span><span class="total-value grand">' + money(total) + '</span></div>');
        $('totalsList').innerHTML = rows.join("");
        $('totalsSection').style.display = "";
      }

      // Guardar en el historial del perfil (aparece en "Mis pedidos").
      // Idempotente por referencia.
      try{
        const orderRef = (order && order.ref) || ref;
        if(window.AVPerfil && order && order.cart && orderRef){
          if(sessionStorage.getItem('av_order_saved_' + orderRef) !== '1'){
            AVPerfil.addOrder({
              ref:    orderRef,
              fecha:  new Date().toISOString(),
              estado: "APROBADO",
              items:  order.cart.map(i => ({ qty: i.qty || 1, name: i.name })),
              total:  order.total || 0
            });
            sessionStorage.setItem('av_order_saved_' + orderRef, '1');
          }
        }
      }catch(e){ console.error("[addOrder]", e); }

      // Limpiar carrito y sesión
      if(ref || (order && order.ref)) localStorage.removeItem('av_cart');
      sessionStorage.removeItem('av_email');
      sessionStorage.removeItem('av_total');
      sessionStorage.removeItem('av_reference');
      sessionStorage.removeItem('av_order');
      localStorage.removeItem('av_order');
    }catch(e){ console.error("[checkout-success]", e); }
  }

  if(document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', render);
  else
    render();
})();
</script>
