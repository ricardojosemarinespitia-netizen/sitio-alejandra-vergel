<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compra Confirmada · Alejandra Vergel</title>
<link rel="icon" type="image/png" href="img/brand/favicon.png">
<link rel="apple-touch-icon" href="img/brand/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F4EF;
  --white:#FFFFFF;
  --noir:#14110F;
  --ink:#2A2622;
  --tiffany:#0ABAB5;
  --gold:#C9A24B;
  --line:#E6DFD4;
  --serif:"Cormorant Garamond", serif;
  --sans:"Jost", sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--ivory);
  color:var(--ink);
  display:grid;place-items:center;min-height:100vh;padding:20px;
}

.success-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:4px;
  padding:60px 40px;
  text-align:center;
  max-width:500px;
  box-shadow:0 10px 30px -16px rgba(20,17,15,.30);
}

.success-icon{
  width:80px;height:80px;margin:0 auto 30px;
  background:var(--tiffany);border-radius:50%;
  display:grid;place-items:center;color:#fff;
  font-size:48px;
}

h1{
  font-family:var(--serif);
  font-size:2.2rem;
  margin-bottom:16px;
  color:var(--noir);
}

.ref-number{
  font-size:.9rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:30px;
  font-weight:600;
}

p{
  font-size:1rem;
  line-height:1.7;
  color:var(--ink-soft);
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  padding:14px 32px;
  background:var(--noir);
  color:#fff;
  text-decoration:none;
  font-size:.85rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  font-weight:600;
  border-radius:4px;
  transition:.3s;
  margin-top:20px;
}

.btn:hover{background:var(--tiffany)}

.details{
  margin-top:40px;
  padding-top:30px;
  border-top:1px solid var(--line);
  text-align:left;
}

.detail-row{
  display:flex;justify-content:space-between;
  padding:10px 0;
  font-size:.9rem;
}

.label{color:var(--ink-soft)}
.value{font-weight:600;color:var(--noir)}
</style>
</head>
<body>

<div class="success-card">
  <div class="success-icon">✓</div>

  <h1>¡Compra Confirmada!</h1>

  <div class="ref-number" id="refNumber">Referencia: —</div>

  <p>Tu pago ha sido procesado exitosamente. En breve recibirás un correo de confirmación con los detalles de tu orden.</p>

  <div class="details">
    <div class="detail-row">
      <span class="label">Total pagado:</span>
      <span class="value" id="totalPaid">$ 0</span>
    </div>
    <div class="detail-row">
      <span class="label">Email:</span>
      <span class="value" id="emailInfo">—</span>
    </div>
    <div class="detail-row">
      <span class="label">Estado:</span>
      <span class="value" id="statusInfo">Confirmada</span>
    </div>
  </div>

  <a href="index.html" class="btn">Volver al catálogo</a>
</div>

<script src="products.js"></script>
<script src="colombia.js"></script>
<script src="store.js"></script>
<script src="club.js"></script>
<script src="checkout.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  // Leer referencia y el id de transacción que Wompi añade al redirigir
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  const wompiId = params.get('id');

  if (ref) {
    document.getElementById('refNumber').textContent = `Referencia: ${ref}`;
  }

  // Leer datos de sessionStorage (guardados en checkout.js)
  const email = sessionStorage.getItem('av_email');
  const total = sessionStorage.getItem('av_total');

  if (email) document.getElementById('emailInfo').textContent = email;
  if (total) document.getElementById('totalPaid').textContent = total;

  const orderRaw = sessionStorage.getItem('av_order');
  const order = (() => { try { return orderRaw ? JSON.parse(orderRaw) : null; } catch(e){ return null; } })();

  // Verificar el estado REAL del pago contra la API pública de Wompi antes de
  // registrar nada. Evita que alguien registre una venta visitando esta URL
  // a mano sin haber pagado.
  let status = null;
  if (wompiId) {
    try {
      const r = await fetch("https://production.wompi.co/v1/transactions/" + encodeURIComponent(wompiId));
      const j = await r.json();
      status = j && j.data && j.data.status;
    } catch(e){ console.error("[Wompi API]", e); }
  }

  // APPROVED = aprobado · PENDING = PSE/Bancolombia en proceso (la venta ya es
  // real). En ambos casos registramos en Sheets y marcamos el código usado.
  if (order && (status === "APPROVED" || status === "PENDING")) {
    try { await guardarPedido(order); } catch(e){ console.error("[guardarPedido]", e); }
    document.getElementById('statusInfo').textContent = status === "APPROVED" ? "Confirmada" : "En proceso (PSE)";
  }

  // Correo de confirmación de compra (al cliente + Cc a Alejandra)
  try {
    const yaEnviado = sessionStorage.getItem('av_email_sent');
    if (ref && order && yaEnviado !== ref) {
      if (order.emailParams && order.email) {
        fetch("https://api.emailjs.com/api/v1.0/email/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service_id: "service_uf7imru",
            template_id: "template_9mtgc6g",
            user_id: "FJTqsKFpGZTR_76vP",
            template_params: Object.assign({}, order.emailParams, {
              referencia: ref,
              to_email: order.email,
              mensaje: "",
              name: "Alejandra Vergel · Joyas de Autor",
              email: order.email
            })
          })
        }).catch(err => console.error("[EmailJS]", err));
        sessionStorage.setItem('av_email_sent', ref);
      }
    }
  } catch(e){ console.error(e); }

  // Vaciar carrito: la compra ya fue pagada
  if (ref) localStorage.removeItem('av_cart');

  // Limpiar sessionStorage
  sessionStorage.removeItem('av_email');
  sessionStorage.removeItem('av_total');
  sessionStorage.removeItem('av_reference');
  sessionStorage.removeItem('av_order');
});
</script>
</body>
</html>
