<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compra Confirmada · Alejandra Vergel</title>
<link rel="icon" type="image/png" href="img/brand/favicon.png">
<link rel="apple-touch-icon" href="img/brand/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F4EF;
  --white:#FFFFFF;
  --noir:#14110F;
  --ink:#2A2622;
  --ink-soft:#6B6460;
  --tiffany:#0ABAB5;
  --gold:#C9A24B;
  --line:#E6DFD4;
  --sage:#5C7A5C;
  --serif:"Cormorant Garamond", serif;
  --sans:"Jost", sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--ivory);
  color:var(--ink);
  display:grid;place-items:center;min-height:100vh;padding:20px;
}

.success-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:4px;
  padding:50px 40px;
  text-align:center;
  max-width:540px;
  width:100%;
  box-shadow:0 10px 30px -16px rgba(20,17,15,.25);
}

.success-icon{
  width:72px;height:72px;margin:0 auto 24px;
  background:var(--tiffany);border-radius:50%;
  display:grid;place-items:center;color:#fff;
  font-size:40px;
}

h1{
  font-family:var(--serif);
  font-size:2rem;
  margin-bottom:6px;
  color:var(--noir);
}

.customer-name{
  font-size:1.05rem;
  color:var(--ink-soft);
  margin-bottom:18px;
  font-style:italic;
}

.ref-number{
  font-size:.78rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:28px;
}

.msg{
  font-size:.95rem;
  line-height:1.7;
  color:var(--ink-soft);
  margin-bottom:0;
}

/* Productos */
.section{
  margin-top:32px;
  padding-top:28px;
  border-top:1px solid var(--line);
  text-align:left;
}

.section-title{
  font-size:.7rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:16px;
  font-weight:600;
}

.product-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:12px;
  font-size:.9rem;
}
.product-row:last-child{border-bottom:none}

.product-name{
  color:var(--noir);
  font-weight:500;
  flex:1;
}
.product-sub{
  font-size:.78rem;
  color:var(--ink-soft);
  margin-top:2px;
}
.product-price{
  color:var(--noir);
  font-weight:600;
  white-space:nowrap;
}

/* Totales */
.totals{
  margin-top:0;
}
.total-row{
  display:flex;justify-content:space-between;
  padding:9px 0;
  font-size:.88rem;
  border-bottom:1px solid var(--line);
}
.total-row:last-child{border-bottom:none}
.total-label{color:var(--ink-soft)}
.total-value{font-weight:600;color:var(--noir)}
.total-value.discount{color:var(--sage)}
.total-value.grand{font-size:1.05rem;color:var(--tiffany)}
.total-label.grand{font-weight:600;color:var(--noir);font-size:.95rem}

/* Estado */
.status-badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:28px;
}
.status-badge.approved{background:#E8F5E9;color:#2E7D32}
.status-badge.pending{background:#FFF8E1;color:#F57F17}
.status-badge.checking{background:#F5F5F5;color:#777}

.btn{
  display:inline-block;
  margin-top:32px;
  padding:14px 36px;
  background:var(--noir);
  color:#fff;
  text-decoration:none;
  font-size:.8rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  font-weight:600;
  border-radius:4px;
  transition:.3s;
}
.btn:hover{background:var(--tiffany)}

@media(max-width:480px){
  .success-card{padding:36px 22px}
  h1{font-size:1.7rem}
}
</style>
</head>
<body>

<div class="success-card">
  <div class="success-icon">✓</div>

  <h1>¡Compra confirmada!</h1>
  <div class="customer-name" id="customerName" style="display:none"></div>
  <div class="ref-number" id="refNumber"></div>

  <div class="status-badge checking" id="statusBadge">Verificando pago…</div>

  <p class="msg">Recibirás un correo de confirmación con los detalles de tu pedido.</p>

  <!-- Productos -->
  <div class="section" id="productsSection" style="display:none">
    <div class="section-title">Productos</div>
    <div id="productsList"></div>
  </div>

  <!-- Totales -->
  <div class="section totals" id="totalsSection" style="display:none">
    <div class="section-title">Resumen de pago</div>
    <div id="totalsList"></div>
  </div>

  <a href="index.html" class="btn">Volver al catálogo</a>
</div>

<script src="products.js"></script>
<script src="colombia.js"></script>
<script src="store.js"></script>
<script src="club.js?v=4"></script>
<script src="checkout.js?v=4"></script>
<script>
function money(n){ return "$ " + Math.round(n).toLocaleString("es-CO"); }

// Red de seguridad absoluta: pase lo que pase en initSuccessPage() (error de
// JS, WebView de banco raro, timing de eventos), el badge NUNCA debe quedar
// colgado en "Verificando pago". Independiente del resto del script.
setTimeout(() => {
  const b = document.getElementById('statusBadge');
  if(b && b.classList.contains('checking')){
    b.className = 'status-badge approved';
    b.textContent = 'Confirmada';
  }
}, 4000);

async function initSuccessPage() {
  const params   = new URLSearchParams(window.location.search);
  const ref      = params.get('ref');
  const wompiId  = params.get('id');

  if(ref) document.getElementById('refNumber').textContent = "Ref: " + ref;

  // sessionStorage se pierde al volver del redirect externo de Wompi (móvil sobre
  // todo). Recuperamos el pedido desde localStorage como respaldo.
  const orderRaw = sessionStorage.getItem('av_order') || localStorage.getItem('av_order');
  const order    = (() => { try { return orderRaw ? JSON.parse(orderRaw) : null; } catch(e){ return null; } })();

  // Nombre del cliente
  if(order && order.firstName){
    const el = document.getElementById('customerName');
    el.textContent = "Hola, " + order.firstName + " " + (order.lastName || "");
    el.style.display = "";
  }

  // Mostrar productos
  if(order && order.cart && order.cart.length){
    const list = document.getElementById('productsList');
    order.cart.forEach(item => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <div>
          <div class="product-name">${item.qty > 1 ? item.qty + "× " : ""}${item.name}</div>
          ${item.color ? `<div class="product-sub">${item.color}</div>` : ""}
          ${item.size  ? `<div class="product-sub">Talla ${item.size}</div>`  : ""}
        </div>
        <div class="product-price">${money(item.price * item.qty)}</div>`;
      list.appendChild(row);
    });
    document.getElementById('productsSection').style.display = "";
  }

  // Mostrar totales
  if(order && (order.subtotal !== undefined || order.total !== undefined)){
    const list     = document.getElementById('totalsList');
    const subtotal = order.subtotal || order.total || 0;
    const descPct  = order.discount || 0;
    const descMonto = descPct ? Math.round(subtotal * descPct / 100) : 0;
    const subtotalConDesc = subtotal - descMonto;
    const envio    = order.shipping !== undefined ? order.shipping : 0;
    const total    = order.total !== undefined ? order.total : (subtotalConDesc + envio);

    const rows = [];
    rows.push(`<div class="total-row"><span class="total-label">Subtotal</span><span class="total-value">${money(subtotal)}</span></div>`);
    if(descMonto > 0)
      rows.push(`<div class="total-row"><span class="total-label">Descuento Club (${descPct}%)</span><span class="total-value discount">− ${money(descMonto)}</span></div>`);
    rows.push(`<div class="total-row"><span class="total-label">Envío</span><span class="total-value">${envio === 0 ? "Gratis" : money(envio)}</span></div>`);
    rows.push(`<div class="total-row"><span class="total-label grand">Total pagado</span><span class="total-value grand">${money(total)}</span></div>`);
    list.innerHTML = rows.join("");
    document.getElementById('totalsSection').style.display = "";
  }

  // Verificar estado real del pago en Wompi — TIMEOUT de 3s MAX.
  // Si Wompi no responde a tiempo o falla, seguimos igual: registramos la venta
  // y enviamos correo (el webhook de Wompi es la fuente autoritativa).
  const badge = document.getElementById('statusBadge');
  let status  = null;

  if(wompiId){
    // Wrapper con timeout garantizado
    status = await Promise.race([
      (async () => {
        try {
          const r = await fetch("https://production.wompi.co/v1/transactions/" + encodeURIComponent(wompiId));
          const j = await r.json();
          return j?.data?.status || null;
        } catch(e) {
          console.error("[Wompi API]", e);
          return null;
        }
      })(),
      new Promise(resolve => setTimeout(() => resolve(null), 3000))
    ]);
  }

  if(status === "APPROVED"){
    badge.className = "status-badge approved";
    badge.textContent = "Pago aprobado";
  } else if(status === "PENDING"){
    badge.className = "status-badge pending";
    badge.textContent = "Pago en proceso (PSE)";
  } else if(status === "DECLINED" || status === "VOIDED" || status === "ERROR"){
    badge.className = "status-badge pending";
    badge.textContent = "Pago rechazado";
  } else {
    // Timeout, error red, o Wompi offline — mostrar confirmada igual.
    // El webhook es la fuente de verdad y registrará el pago si Wompi lo aprobó.
    badge.className = "status-badge approved";
    badge.textContent = "Confirmada";
  }

  // Registrar venta en Google Sheets (Scenario A: cliente regresa).
  // Se registra SIEMPRE que tengamos un pedido y el pago NO haya sido rechazado.
  // guardarPedido es idempotente (sessionStorage av_done_<ref>).
  const rechazado = (status === "DECLINED" || status === "VOIDED" || status === "ERROR");
  if(order && !rechazado){
    if(order.ref || ref) order.ref = order.ref || ref;
    try{ await guardarPedido(order); }catch(e){ console.error("[guardarPedido]", e); }
  }

  // Correo de confirmación al cliente
  try{
    const yaEnviado = sessionStorage.getItem('av_email_sent');
    const orderRef  = (order && order.ref) || ref;
    if(orderRef && order && yaEnviado !== orderRef){
      if(order.emailParams && order.email){
        fetch("https://api.emailjs.com/api/v1.0/email/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service_id: "service_uf7imru",
            template_id: "template_9mtgc6g",
            user_id: "FJTqsKFpGZTR_76vP",
            template_params: Object.assign({}, order.emailParams, {
              referencia: orderRef,
              to_email:   order.email,
              mensaje:    "",
              name:       "Alejandra Vergel · Joyas de Autor",
              email:      order.email
            })
          })
        }).catch(err => console.error("[EmailJS]", err));
        sessionStorage.setItem('av_email_sent', orderRef);
      }
    }
  }catch(e){ console.error(e); }

  // Vaciar carrito y limpiar sesión
  if(ref || (order && order.ref)) localStorage.removeItem('av_cart');
  sessionStorage.removeItem('av_email');
  sessionStorage.removeItem('av_total');
  sessionStorage.removeItem('av_reference');
  sessionStorage.removeItem('av_order');
  localStorage.removeItem('av_order');
}

// El script está al final del <body>: el DOM ya existe. Esperar a
// DOMContentLoaded es innecesario y en algunos WebViews de bancos (PSE)
// el evento ya se disparó antes de registrar el listener, dejando la
// página colgada en "Verificando pago". Ejecutamos directo si ya está listo.
const runInit = () => initSuccessPage().catch(e => console.error('[initSuccessPage]', e));
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runInit);
} else {
  runInit();
}
</script>
</body>
</html>
